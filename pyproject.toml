[project]
name = "nac-yaml"
version = "2.0.0"
description = "A Python library with common YAML utility functions supporting 'Network as Code'."
license = { text = "MPL-2.0" }
readme = "README.md"
authors = [
    { name = "Daniel Schmidt", email = "danischm@cisco.com" },
]
maintainers = [
    { name = "Daniel Schmidt", email = "danischm@cisco.com" },
]
requires-python = ">=3.10"
keywords = ["yaml", "network", "automation", "cisco", "utilities"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "ruamel.yaml>=0.18.15",
]

[project.urls]
homepage = "https://github.com/netascode/nac-yaml"
repository = "https://github.com/netascode/nac-yaml"
documentation = "https://github.com/netascode/nac-yaml"

[project.optional-dependencies]
vault = [
    # ansible-core does not run on Windows
    "ansible-core>=2.17.6; sys_platform != 'win32'",
]
dev = [
    # ansible-core does not run on Windows; the vault tests are skipped there
    "ansible-core>=2.17.6; sys_platform != 'win32'",
    "bandit[toml]>=1.9.1",
    "pre-commit>=4.4.0",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.5",
    "ty>=0.0.78",
]

[tool.hatch.build.targets.sdist]
include = ["nac_yaml", "tests", "CHANGELOG.md", "README.md"]

[tool.coverage.run]
source = ["nac_yaml"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "@abstract", "except ImportError:"]
omit = ["*/__main__.py"]

[tool.pytest.ini_options]
markers = ["unit", "integration"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
"all" = "error"
# typing.override requires Python 3.12+
"missing-override-decorator" = "ignore"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["nac_yaml"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # Skip assert_used test

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
