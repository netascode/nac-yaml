repos:
  - repo: local
    hooks:
      - id: license-headers
        name: Check license headers
        entry: uv run python scripts/license_headers.py --fix
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

      - id: bandit
        name: bandit
        entry: uv run bandit -c pyproject.toml -r nac_yaml/ -ll
        language: system
        types: [python]
        pass_filenames: false
